name: Sync marketplace manifest

# The committed .claude-plugin/marketplace.json is generated by `pnpm build`.
# Rather than ask contributors to rebuild + commit it, CI regenerates it on every
# push to main and commits any change back. Pushes made with GITHUB_TOKEN do not
# trigger further workflows, so this cannot loop (the [skip ci] tag is belt-and-braces).
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-manifest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit manifest if it changed
        run: |
          if [[ -n "$(git status --porcelain .claude-plugin/marketplace.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .claude-plugin/marketplace.json
            git commit -m "chore: regenerate marketplace manifest [skip ci]"
            git push origin HEAD:main
          else
            echo "Manifest already up to date."
          fi
